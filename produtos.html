<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Produtos</title>

    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/components.css">
</head>

<body>

    <main class="container">

        <a href="index.html" class="voltar">← Voltar</a>

        <section class="cabecalho">
            <h1>Cadastro de Produtos</h1>
            <p>Adicione e gerencie os produtos e suas quantidades.</p>
        </section>

        <section class="formulario-falta">

            <h2>Adicionar produto</h2>

            <form id="formProduto">

                <div class="campo">
                    <label for="nomeProduto">Nome do produto</label>

                    <input
                        type="text"
                        id="nomeProduto"
                        placeholder="Digite o nome do produto"
                        required
                    >
                </div>

                <div class="campo">
                    <label for="quantidadeTotalCarro">
                        Quantidade total no carro
                    </label>

                    <input
                        type="number"
                        id="quantidadeTotalCarro"
                        min="0"
                        placeholder="0"
                        required
                    >
                </div>

                <button type="submit">
                    Adicionar produto
                </button>

            </form>

        </section>

        <section class="faltas-registradas">

            <h2>Produtos cadastrados</h2>

            <div class="campo">
                <input
                    type="text"
                    id="pesquisaProduto"
                    placeholder="Pesquisar produto..."
                >
            </div>

            <table>

                <thead>
                    <tr>
                        <th>Nome do produto</th>
                        <th>Quantidade total no carro</th>
                        <th>Ações</th>
                    </tr>
                </thead>

                <tbody id="tabelaProdutos">
                </tbody>

            </table>

        </section>

    </main>

    <script src="js/api.js"></script>
    <script src="js/produtos.js"></script>

    <script src="js/layout.js"></script>
    <script>
    criarLayout("produtos");
    </script>

    <script src="js/api.js"></script>
    <script src="js/produtos.js"></script>

</body>
</html>
